---
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push makes an in-flight run irrelevant; don't queue integration jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  # Fast tier: everything that needs no running services. Target under 90s.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install toolchain
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Generate .env
        run: |
          cp .env.example .env
          ./scripts/gen_secrets.sh

      # Exactly the target developers run. hadolint is not on the runner and
      # the linters are containerised anyway, so parity costs only two small
      # image pulls and removes any chance of CI and local drifting.
      - name: make lint
        run: make lint PY="python"

      - name: make validate
        run: make validate

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install toolchain
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: make test
        run: make test PY="python"

  # tests/unit/test_dag_integrity.py calls pytest.importorskip("airflow"), so on
  # a bare runner it always skips. Running it inside the image the scheduler
  # actually uses turns it into a real check.
  dags:
    name: dag integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build test image
        run: docker build --target test -t airflow-test:ci -f docker/airflow/Dockerfile .

      - name: Parse DAG bag
        run: |
          docker run --rm --entrypoint python airflow-test:ci \
            -m pytest /opt/airflow/tests/unit/test_dag_integrity.py -q

  # Integration tier: the real stack, exercised end to end.
  integration:
    name: end-to-end
    runs-on: ubuntu-latest
    needs: [lint, unit, dags]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install toolchain
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Generate .env
        run: |
          cp .env.example .env
          echo "AIRFLOW_UID=$(id -u)" >> .env
          # Manual-only DAG: a scheduled run must not race the suite for the
          # uploaded file. Ingestion is idempotent either way, but this keeps
          # the end-to-end result deterministic.
          echo "SALES_DAG_SCHEDULE=none" >> .env
          ./scripts/gen_secrets.sh

      # --wait blocks until every named service reports healthy, replacing a
      # hand-rolled polling loop and failing fast when one never gets there.
      - name: Start the platform
        run: |
          docker compose up -d --build --wait --wait-timeout 600 \
            postgres minio airflow-apiserver airflow-scheduler airflow-dag-processor metabase

      - name: Provision Metabase
        run: python -m scripts.provision_metabase

      - name: make e2e
        run: make e2e PY="python"

      - name: Report failure in the run summary
        if: failure()
        run: |
          {
            echo "## End-to-end failed"
            echo
            echo "| service | state |"
            echo "| :-- | :-- |"
            docker compose ps --all --format '| {{.Service}} | {{.Status}} |' || true
            echo
            echo "Service logs are attached as the \`compose-logs\` artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect logs
        if: failure()
        run: |
          mkdir -p out/logs
          docker compose logs --no-color > out/logs/compose.log 2>&1 || true
          docker compose ps --all > out/logs/ps.txt 2>&1 || true
          # A container killed for memory shows nothing in its application log,
          # so record the exit state explicitly.
          for c in $(docker compose ps -aq); do
            docker inspect -f '{{.Name}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} status={{.State.Status}}' \
              "$c" >> out/logs/ps.txt 2>&1 || true
          done
          # Task logs are written to files inside the scheduler, not to stdout.
          docker compose exec -T airflow-scheduler \
            bash -c 'find /opt/airflow/logs -name "*.log" -newermt "-30 minutes" \
              -print -exec tail -n 80 {} \;' > out/logs/tasks.log 2>&1 || true

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs-${{ github.run_id }}
          path: out/logs/
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose down -v

  # Deployment step 1: publish the immutable artifact.
  publish:
    name: publish image
    runs-on: ubuntu-latest
    needs: [integration]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      # The runner's default buildx driver is plain "docker", which cannot
      # export a cache; type=gha needs the container driver this sets up.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image reference
        id: meta
        run: |
          repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${repo}/airflow:sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      # Tagged by commit sha, never latest: a mutable tag is how CI goes green
      # while the environment keeps running older code.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/airflow/Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deployment step 2: deploy that exact published image into a designated
  # test environment and prove data still flows through it. Nothing is rebuilt
  # here — this exercises the artifact that would ship.
  deploy-test:
    name: deploy to test environment
    runs-on: ubuntu-latest
    needs: [publish]
    environment:
      name: test
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install toolchain
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate .env
        run: |
          cp .env.example .env
          echo "AIRFLOW_UID=$(id -u)" >> .env
          # Manual-only DAG: a scheduled run must not race the suite for the
          # uploaded file. Ingestion is idempotent either way, but this keeps
          # the end-to-end result deterministic.
          echo "SALES_DAG_SCHEDULE=none" >> .env
          ./scripts/gen_secrets.sh

      - name: Deploy the published image
        env:
          PUBLISHED_IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          docker pull "$PUBLISHED_IMAGE"
          # Point compose at the published artifact instead of a local build.
          AIRFLOW_IMAGE="${PUBLISHED_IMAGE%:*}" IMAGE_TAG="${PUBLISHED_IMAGE##*:}" \
            docker compose up -d --no-build --wait --wait-timeout 600 \
              postgres minio airflow-apiserver airflow-scheduler airflow-dag-processor metabase

      - name: Provision Metabase
        run: python -m scripts.provision_metabase

      - name: Smoke-test the deployed artifact
        run: python -m pytest tests/integration -q

      - name: Record what was deployed
        if: always()
        env:
          PUBLISHED_IMAGE: ${{ needs.publish.outputs.image }}
          OUTCOME: ${{ job.status }}
        run: |
          {
            echo "## Test environment deploy: $OUTCOME"
            echo
            echo "Image: \`$PUBLISHED_IMAGE\`"
            echo
            echo "Deployed with --no-build, so the artifact tested is the one published."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect logs
        if: failure()
        run: |
          mkdir -p out/logs
          docker compose logs --no-color > out/logs/compose.log 2>&1 || true

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-logs-${{ github.run_id }}
          path: out/logs/
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose down -v
