name: Mini Data Platform CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository }}

jobs:
  # ==========================================================================
  # CI 1 — static checks: Python lint, Dockerfile lint, compose validation
  # ==========================================================================
  lint:
    name: Lint (python, dockerfiles, compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tooling
        run: pip install ruff==0.8.6

      - name: Ruff check
        run: ruff check . --output-format=github

      - name: Ruff format check
        run: ruff format --check .

      # `dockerfile` must be the literal filename to match against, not a glob:
      # with recursive:true the action does `find . -name "$dockerfile"`, so a
      # value like "docker/**/Dockerfile" never matches anything (find -name
      # only compares basenames) and the step was passing without linting
      # either docker/airflow/Dockerfile or docker/data_generator/Dockerfile.
      - name: Lint Dockerfiles (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true
          dockerfile: Dockerfile
          failure-threshold: error

      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config --quiet
          echo "Services declared:"
          docker compose config --services

      - name: Check SQL init scripts are present and non-empty
        run: |
          for file in config/postgres/init/*.sql; do
            test -s "$file" || { echo "Empty SQL file: $file"; exit 1; }
            echo "ok: $file"
          done

  # ==========================================================================
  # CI 2 — unit tests for the transformation rules and the DAG structure
  # ==========================================================================
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Run unit tests
        run: pytest tests/unit -v --junit-xml=unit-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: unit-results.xml

  # ==========================================================================
  # CI 3 — DAG integrity, exercised in the real Airflow image
  #
  # tests/unit/test_dag_integrity.py does `pytest.importorskip("airflow")` so
  # it runs cleanly in the unit-tests job above even without Airflow
  # installed - but that also means it always skips there, since the runner
  # never has Airflow. This job builds the "test" stage of the Airflow image
  # (same base, same providers, same DAG files) and runs that same test
  # inside it, so DAG import/graph errors actually fail CI instead of being
  # silently skipped.
  # ==========================================================================
  dag-integrity:
    name: DAG integrity (in-container)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Build Airflow test image
        run: docker build --target test -t airflow-test:ci -f docker/airflow/Dockerfile .

      - name: Parse DAG bag
        run: |
          docker run --rm --entrypoint python airflow-test:ci \
            -m pytest /opt/airflow/tests/unit/test_dag_integrity.py -v

  # ==========================================================================
  # CI 4 — build the custom images and publish them to GHCR
  # ==========================================================================
  build-images:
    name: Build ${{ matrix.service }} image
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, dag-integrity]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: airflow
            dockerfile: docker/airflow/Dockerfile
          - service: data-generator
            dockerfile: docker/data_generator/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ==========================================================================
  # CI 5 — data flow validation:
  #        MinIO -> Airflow -> PostgreSQL -> Metabase, on a real stack
  # ==========================================================================
  data-flow-validation:
    name: Data flow validation (end-to-end)
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, dag-integrity]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Prepare environment
        run: |
          cp .env.example .env
          echo "AIRFLOW_UID=$(id -u)" >> .env

      - name: Start the platform
        run: docker compose up -d --build

      - name: Wait for services to report healthy
        run: |
          set -e
          for service in postgres minio airflow-apiserver airflow-scheduler airflow-dag-processor metabase; do
            echo "Waiting for $service..."
            for attempt in $(seq 1 60); do
              container=$(docker compose ps -q "$service")
              status=$(docker inspect -f '{{.State.Health.Status}}' "$container" 2>/dev/null || echo starting)
              if [ "$status" = "healthy" ]; then
                echo "  $service is healthy"
                break
              fi
              if [ "$attempt" = "60" ]; then
                echo "  $service never became healthy (last status: $status)"
                docker compose logs --tail=80 "$service"
                exit 1
              fi
              sleep 5
            done
          done

      - name: Provision Metabase (admin user + analytics connection)
        run: docker compose --profile setup run --rm metabase-init

      - name: Verify the DAG parsed without errors
        run: |
          docker compose exec -T airflow-dag-processor airflow dags list
          errors=$(docker compose exec -T airflow-dag-processor airflow dags list-import-errors --output json)
          echo "$errors"
          if [ "$(printf '%s' "$errors" | tr -d '[:space:]')" != "[]" ]; then
            echo "::error::Airflow reported DAG import errors"
            exit 1
          fi

      - name: Run end-to-end data flow tests
        env:
          MINIO_ENDPOINT: http://localhost:9000
          AIRFLOW_URL: http://localhost:8080
          METABASE_URL: http://localhost:3000
          POSTGRES_HOST: localhost
        run: pytest tests/integration -v --junit-xml=integration-results.xml

      - name: Show pipeline summary
        if: always()
        run: |
          docker compose exec -T postgres psql -U platform -d analytics -c \
            "SELECT * FROM analytics.v_kpi_summary;" || true
          docker compose exec -T postgres psql -U platform -d analytics -c \
            "SELECT * FROM analytics.v_pipeline_health LIMIT 10;" || true

      - name: Dump logs on failure
        if: failure()
        run: |
          # Under LocalExecutor the scheduler runs the tasks, so a task
          # traceback lands there - give it the most room.
          echo "::group::airflow-scheduler"
          docker compose logs --tail=400 airflow-scheduler || true
          echo "::endgroup::"
          for service in airflow-dag-processor airflow-apiserver minio postgres metabase; do
            echo "::group::$service"
            docker compose logs --tail=80 "$service" || true
            echo "::endgroup::"
          done
          # Task logs are written to files, not stdout, so surface them directly.
          echo "::group::task logs on disk"
          docker compose exec -T airflow-scheduler \
            bash -c 'find /opt/airflow/logs -name "*.log" -newermt "-30 minutes" -print -exec tail -n 60 {} \;' || true
          echo "::endgroup::"
          # Did any container get OOM-killed? That is invisible in the app logs.
          echo "::group::container exit states"
          docker compose ps -a
          for c in $(docker compose ps -aq); do
            docker inspect -f '{{.Name}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} status={{.State.Status}}' "$c" || true
          done
          echo "::endgroup::"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: integration-results.xml

      - name: Tear down
        if: always()
        run: docker compose down -v

  # ==========================================================================
  # CD — deploy the validated stack to the test environment
  # ==========================================================================
  deploy-test:
    name: Deploy to test environment
    runs-on: ubuntu-latest
    needs: [build-images, data-flow-validation]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: test
      url: ${{ vars.TEST_ENV_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: echo "value=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Deploy over SSH
        if: vars.DEPLOY_HOST != ''
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ${{ vars.DEPLOY_PATH }}
            git fetch --all && git reset --hard origin/main
            export IMAGE_REGISTRY=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}
            export IMAGE_TAG=${{ steps.tag.outputs.value }}
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker compose ps

      - name: Post-deploy smoke check
        if: vars.TEST_ENV_URL != ''
        run: |
          set -e
          for path in ":8080/health" ":3000/api/health"; do
            url="${{ vars.TEST_ENV_URL }}${path}"
            echo "Checking $url"
            curl --fail --silent --show-error --retry 10 --retry-delay 10 --retry-all-errors "$url" > /dev/null
          done
          echo "Test environment is serving Airflow and Metabase."

      - name: Deployment not configured
        if: vars.DEPLOY_HOST == ''
        run: |
          echo "::notice::No DEPLOY_HOST variable set - skipping remote deployment."
          echo "Images published as ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/*:${{ steps.tag.outputs.value }}"
          echo "Set repository variables DEPLOY_HOST, DEPLOY_USER, DEPLOY_PATH, TEST_ENV_URL"
          echo "and the DEPLOY_SSH_KEY secret to enable continuous deployment."
